# Build pre-compiled static libraries for openalexSnapshot's Rust core and
# attach them to the `prebuilt-libs` GitHub Release.
#
# Trigger manually (workflow_dispatch) whenever the Rust source changes
# (src/rust/** or Cargo.lock).  CI (R-CMD-check) downloads from this release
# instead of compiling from source, cutting check time from ~40 min to ~2 min.
#
# Targets built:
#   x86_64-unknown-linux-gnu   (ubuntu-22.04 runner)
#   aarch64-apple-darwin       (macos-latest / Apple Silicon runner)
#   x86_64-apple-darwin        (macos-13 / Intel runner)
#
# Windows is currently excluded — MinGW cross-compilation of bundled DuckDB
# is not yet supported; tracked as a future task.

name: Build prebuilt libs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/rust/**'
      - 'src/rust/Cargo.lock'

permissions:
  contents: write   # needed to create/update the release

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: libopenalexSnapshot-x86_64-unknown-linux-gnu.a

          - os: macos-latest       # Apple Silicon
            target: aarch64-apple-darwin
            artifact: libopenalexSnapshot-aarch64-apple-darwin.a
            macosx_deployment_target: "11.0"

          - os: macos-13           # Intel
            target: x86_64-apple-darwin
            artifact: libopenalexSnapshot-x86_64-apple-darwin.a
            macosx_deployment_target: "10.13"

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust
          key: prebuilt-${{ matrix.target }}

      - name: Build static library (Linux)
        if: runner.os == 'Linux'
        run: |
          cd src/rust
          cargo build --release --lib --target ${{ matrix.target }}

      - name: Build static library (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        run: |
          cd src/rust
          cargo build --release --lib --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          cp src/rust/target/${{ matrix.target }}/release/libopenalexSnapshot.a \
             ${{ matrix.artifact }}

      - name: Upload to prebuilt-libs release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prebuilt-libs
          name: "Prebuilt static libraries"
          body: |
            Pre-compiled `libopenalexSnapshot.a` static libraries for each
            supported platform. Downloaded automatically by `configure` during
            `R CMD INSTALL` / `R CMD check` to avoid compiling Rust from source.

            Regenerate by pushing a change to `src/rust/**` on `main`, or by
            triggering the *Build prebuilt libs* workflow manually.
          files: ${{ matrix.artifact }}
