# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Pre-compiled static libraries are downloaded by configure → tools/download_prebuilt.R
# from the `prebuilt-libs` GitHub Release, cutting check time from ~40 min to ~2 min.
# The Rust toolchain is kept as a fallback in case the download fails.
#
# Trigger the `build-libs` workflow manually after any Rust source change.
#
# Windows is excluded: bundled DuckDB cannot be compiled from source via Rust
# on the MinGW toolchain; tracked as a future task.
on:
  push:
    branches: [main, dev]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: macos-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      # Set to 'true' to skip the prebuilt download and compile from source.
      OPENALEXSNAPSHOT_BUILD_FROM_SOURCE: false

    steps:
      - uses: actions/checkout@v4

      # Rust is only needed if the prebuilt download fails (fallback path).
      - name: Install Rust toolchain (fallback for prebuilt download failure)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts (fallback only)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--no-build-vignettes")'
          args: 'c("--no-manual","--as-cran","--no-vignettes")'
