[package]
name = 'openalexSnapshot'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.65'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'openalexSnapshot'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
openalex-core = { git = "https://github.com/rkrug/openalex-snapshot.git", tag = "v0.5.0", features = ["conversion"] }
